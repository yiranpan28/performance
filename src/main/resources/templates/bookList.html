<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Book Library</title>
</head>
<body>
<h1>My Book Library</h1>

<h2>Add New Book</h2>
<form th:action="@{/book/add}" th:object="${newBook}" method="post">
  <label>Book Name:</label>
  <input type="text" th:field="*{bookName}" required><br>
  <label>Author:</label>
  <input type="text" th:field="*{author}" required><br>
  <label>Price:</label>
  <input type="number" step="0.01" th:field="*{price}" required><br>
  <button type="submit">Add Book</button>
</form>

<h2>All Books</h2>
<table border="1">
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Author</th>
    <th>Price</th>
    <th>Action</th>
  </tr>
  <tr th:each="book : ${books}">
    <td th:text="${book.id}"></td>
    <td th:text="${book.bookName}"></td>
    <td th:text="${book.author}"></td>
    <td th:text="${book.price}"></td>
    <td>
      <a th:href="@{/book/delete/{id}(id=${book.id})}">Delete</a >
    </td>
  </tr>
</table>
</body>
</html>
